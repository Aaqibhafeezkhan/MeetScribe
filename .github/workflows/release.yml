name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # electron-builder names artifacts from package.json `version`.
      # Keep them aligned with the pushed tag (v1.2.3 -> 1.2.3).
      - name: Sync package.json version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm pkg set "version=${GITHUB_REF_NAME#v}"

      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Build
        shell: bash
        env:
          # Code signing is opt-in: wire real certs here once they exist.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: meetscribe-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files and checksums
        shell: bash
        run: |
          mkdir release
          find artifacts -type f \( -name '*.exe' -o -name '*.blockmap' -o -name 'latest.yml' \) -exec cp -v {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MeetScribe ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
