<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';" />
  <title>Transcript</title>
  <style>
    :root {
      --bg: rgba(14, 14, 16, 0.92);
      --border: rgba(255, 255, 255, 0.10);
      --text: #e8e8ea;
      --muted: #7c7c85;
      --them: #6fb4ff;
      --you: #6ee7a8;
      --accent: #ff5f57;
      --font-size: 13px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }

    .panel {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    /* Drag handle. Buttons inside opt out via .no-drag. */
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      -webkit-app-region: drag;
      flex: 0 0 auto;
    }

    .rec-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex: 0 0 auto;
    }
    .rec-dot.live { background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

    .elapsed { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); min-width: 44px; }

    .meters { display: flex; gap: 10px; margin-left: 4px; }
    .meter { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
    .meter-bar { width: 42px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.10); overflow: hidden; }
    .meter-fill { height: 100%; width: 0%; border-radius: 2px; transition: width 90ms linear; }
    .meter.them .meter-fill { background: var(--them); }
    .meter.you .meter-fill { background: var(--you); }

    .spacer { flex: 1 1 auto; }

    .btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      padding: 3px 7px;
      line-height: 1.4;
    }
    .btn:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .btn.primary { color: var(--text); border-color: var(--border); }

    main {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 12px 12px;
      -webkit-user-select: text;
      user-select: text;
    }
    main::-webkit-scrollbar { width: 8px; }
    main::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 4px; }

    .row {
      display: grid;
      grid-template-columns: 62px 46px 1fr;
      gap: 8px;
      padding: 3px 0;
      font-size: var(--font-size);
      line-height: 1.5;
      align-items: baseline;
    }
    .ts { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .who { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .who.system { color: var(--them); }
    .who.mic { color: var(--you); }
    .txt { word-wrap: break-word; overflow-wrap: anywhere; }

    .row.meta { grid-template-columns: 62px 1fr; }
    .row.meta .txt { color: var(--muted); font-style: italic; font-size: 12px; }

    .empty { color: var(--muted); font-size: 12px; padding: 18px 2px; line-height: 1.7; }
    .empty kbd {
      background: rgba(255,255,255,0.10); border-radius: 4px;
      padding: 1px 5px; font-family: inherit; font-size: 11px;
    }

    .jump {
      position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
      -webkit-app-region: no-drag;
      background: rgba(40,40,46,0.96); border: 1px solid var(--border);
      border-radius: 12px; color: var(--text); cursor: pointer;
      font-size: 11px; padding: 4px 11px; display: none;
    }
    .jump.show { display: block; }

    .toast {
      flex: 0 0 auto;
      display: none;
      padding: 6px 12px;
      font-size: 11px;
      color: #ffd7d4;
      background: rgba(180, 50, 44, 0.22);
      border-top: 1px solid rgba(255,120,110,0.25);
    }
    .toast.show { display: block; }
  </style>
</head>
<body>
  <div class="panel">
    <header>
      <div class="rec-dot" id="recDot"></div>
      <div class="elapsed" id="elapsed">00:00</div>
      <div class="meters">
        <div class="meter them"><span id="labelThem">Them</span><div class="meter-bar"><div class="meter-fill" id="meterSystem"></div></div></div>
        <div class="meter you"><span id="labelYou">You</span><div class="meter-bar"><div class="meter-fill" id="meterMic"></div></div></div>
      </div>
      <div class="spacer"></div>
      <button class="btn primary no-drag" id="recordBtn">Record</button>
      <button class="btn no-drag" id="shotBtn" title="Screenshot into the meeting folder (Ctrl+Shift+S)">Shot</button>
      <button class="btn no-drag" id="folderBtn" title="Open meeting folder (Ctrl+Shift+O)">Folder</button>
      <button class="btn no-drag" id="settingsBtn" title="Settings (Ctrl+,)">Settings</button>
      <button class="btn no-drag" id="closeBtn" title="Hide this panel (Ctrl+Shift+T)">&#10005;</button>
    </header>

    <main id="list">
      <div class="empty" id="empty">
        No transcript yet.<br />
        Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>R</kbd> to start recording this meeting.<br />
        <span id="emptyHint"></span>
      </div>
    </main>

    <div class="toast" id="toast"></div>
    <button class="jump" id="jumpBtn">Jump to latest</button>
  </div>

  <script src="./src/ui/transcript-window.js"></script>
</body>
</html>
